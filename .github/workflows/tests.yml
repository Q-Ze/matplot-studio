name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check layout geometry and JavaScript
        run: |
          node --test tests/test_composition_geometry.cjs
          node --test tests/test_composition_clipboard.cjs
          node --check web/app.js
          node --check web/composition.js
          node --check web/composition-clipboard.js
